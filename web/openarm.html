<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KeiArm OpenArm</title>
    <link rel="icon" href="data:," />
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      body { margin: 0; background: #15171a; color: #dfe3e8; overflow: hidden; }
      #main { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
      #panel { position: fixed; top: 12px; left: 12px; width: 504px; max-width: calc(100vw - 48px); padding: 12px;
               border-radius: 8px; background: rgba(21, 23, 26, 0.86); border: 1px solid #2c3138; font-size: 13px; }
      #panel h1 { font-size: 15px; margin: 0 0 8px; }
      .row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
      select, button { background: #23272d; color: inherit; border: 1px solid #3a4049; border-radius: 6px;
                       padding: 4px 8px; font: inherit; }
      button { cursor: pointer; } button:hover { background: #2d333b; }
      .cams { display: flex; gap: 8px; flex-wrap: wrap; }
      .cams figure { margin: 0; } .cams figcaption { color: #9aa4b1; font-size: 11px; margin-top: 2px; }
      .cams canvas { width: 160px; height: 120px; image-rendering: pixelated; border-radius: 4px; display: block; }
      #status { margin-top: 8px; color: #9aa4b1; font-variant-numeric: tabular-nums; white-space: pre-line; }
      #status .ok { color: #6fd08c; } #status .err { color: #f08a8a; }
    </style>
  </head>
  <body>
    <canvas id="main"></canvas>
    <div id="panel">
      <h1>KeiArm — OpenArm v2 両腕の持ち替え（開発中）</h1>
      <div class="row">
        <label>シーン <select id="scene"></select></label>
        <label>エピソード <select id="episode"></select></label>
        <button id="play">エキスパートを再生</button>
        <button id="reset">リセット</button>
      </div>
      <div class="cams">
        <figure><canvas id="cam0" width="160" height="120"></canvas><figcaption>cam_front</figcaption></figure>
        <figure><canvas id="cam1" width="160" height="120"></canvas><figcaption>左手首</figcaption></figure>
        <figure><canvas id="cam2" width="160" height="120"></canvas><figcaption>右手首</figcaption></figure>
      </div>
      <div id="status">読み込み中…</div>
    </div>
    <script type="module" src="/src/openarm/main.js"></script>
  </body>
</html>
