# Build the browser demo and publish it to GitHub Pages.
# Requires: Settings -> Pages -> Source = "GitHub Actions", and the exported model committed at
# web/public/models/keigrasp.onnx and openarm.onnx (+ .json). Scenes and meshes are regenerated here.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: uv sync --locked --no-group train
      - run: uv run --no-sync python scripts/export_web.py
      - run: uv run --no-sync python scripts/export_web_openarm.py
      - run: test -f web/public/models/keigrasp.onnx && test -f web/public/models/openarm.onnx
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  deploy:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
